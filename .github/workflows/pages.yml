# GitHub Pages: the project's front page and the splat viewer with its two
# sample splats, at https://corabeanz.github.io/linescan-hyperspectral-splatting/.
# docs/site/build.sh assembles the site and docs/site/check.mjs opens it in
# headless Chromium; pull requests stop there, and main deploys it.
#
# Pages has to be switched on once, in the repository's Settings > Pages, with
# "GitHub Actions" as the source. Until then the deploy is skipped with a
# warning rather than failing.
name: pages

on:
  push:
    branches: [main]
    paths: ["viewer/**", "docs/site/**", "docs/img/hero.svg", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["viewer/**", "docs/site/**", "docs/img/hero.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: docs/site/build.sh _site
      - name: Install Playwright and its Chromium
        run: |
          # the same Playwright as viewer/package.json
          npm install --no-save --no-package-lock --prefix docs/site "playwright@$(node -p "require('./viewer/package.json').devDependencies.playwright")"
          docs/site/node_modules/.bin/playwright install --with-deps chromium
      - name: Check the site in headless Chromium
        run: node docs/site/check.mjs _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Is Pages switched on?
        id: enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GitHub Pages is off for this repository, so the site wasn't deployed. Switch it on in Settings > Pages with \"GitHub Actions\" as the source, then run this workflow again."
            echo "on=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        id: deployment
        if: steps.enabled.outputs.on == 'true'
        uses: actions/deploy-pages@v4
