# ROS 2 packages for the SO-101 scan arm: build them and run every colcon test in
# a ROS 2 Humble container, on the same Ubuntu 22.04 packages as the Nano's image
# in ros2/docker. The description tests read the CAD model's build report and the
# vendored SO-101 URDF, so changes there run this too.
name: ros2

on:
  push:
    branches: [main]
    paths: ["ros2/**", "cad/build_report.json", "cad/vendor/so101/**", ".github/workflows/ros2.yml"]
  pull_request:
    paths: ["ros2/**", "cad/build_report.json", "cad/vendor/so101/**", ".github/workflows/ros2.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  colcon:
    name: colcon build and test (Humble)
    runs-on: ubuntu-24.04
    container: ros:humble-ros-base
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      ROS_LOCALHOST_ONLY: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install the packages' dependencies (rosdep)
        run: |
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths ros2 --ignore-src --rosdistro humble -y
      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --base-paths ros2 --event-handlers console_cohesion+
      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --base-paths ros2 --executor sequential --event-handlers console_cohesion+ \
            --return-code-on-test-failure
      - name: Test results
        if: ${{ !cancelled() }}
        run: |
          source /opt/ros/humble/setup.bash
          colcon test-result --all --verbose
