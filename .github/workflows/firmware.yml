# Scan-mirror firmware: unit tests on a simulated rig, then the ESP32 build.
name: firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO and pyserial
        run: pip install "platformio==6.2.0" pyserial
      - name: Unit tests (simulated rig)
        run: pio test -e native -v
      - name: Build for the ESP32
        run: pio run -e esp32dev
      - name: Check the host tool
        run: python -m py_compile tools/mirrorctl.py && python tools/mirrorctl.py --help > /dev/null
