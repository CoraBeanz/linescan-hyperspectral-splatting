# Instrument simulator: the self-test (scan the relief target, calibrate the
# simulated instrument with hsical, turn the sweeps into reflectance, compare with
# the truth) and the unit tests. It imports calibration/hsical and the ROS 2
# packages' kinematics, line log and plans, so changes there run it too.
name: sim

on:
  push:
    branches: [main]
    paths:
      - "sim/**"
      - "calibration/hsical/**"
      - "ros2/so101_scan_description/**"
      - "ros2/so101_scan_sweep/**"
      - ".github/workflows/sim.yml"
  pull_request:
    paths:
      - "sim/**"
      - "calibration/hsical/**"
      - "ros2/so101_scan_description/**"
      - "ros2/so101_scan_sweep/**"
      - ".github/workflows/sim.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Self-test and unit tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sim/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Self-test (scan, calibrate, apply, compare with the truth)
        run: python -m hsisim selftest
      - name: Unit tests
        run: python -m pytest -v
