; Scan-mirror firmware: ESP32 + TMC2209 driving the NEMA 8 mirror stepper.
; Flash:        pio run -e esp32dev -t upload
; Serial:       pio device monitor -e esp32dev
; Native tests: pio test -e native   (needs gcc/g++ on the PATH)

[platformio]
default_envs = esp32dev

[env:esp32dev]
; Arduino-ESP32 2.0.17. Pinned: 3.x renamed the timer API this code uses.
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
lib_deps = teemuatlut/TMCStepper @ 0.7.3
monitor_speed = 921600
; Opening the port must not pull EN or IO0 and reset the ESP32.
monitor_dtr = 0
monitor_rts = 0
monitor_echo = yes
monitor_filters = time

[env:native]
; lib/scanmirror on the PC, against the simulated rig in test/.
platform = native
test_framework = unity
build_flags = -Wall -Wextra -Werror -D UNITY_INCLUDE_DOUBLE -D UNITY_SUPPORT_64
