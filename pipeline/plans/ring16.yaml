# Sixteen views of the spot ring.yaml scans, 26 cm in front of the base: straight down, eight
# 15 deg off vertical every 45 deg of azimuth, and seven 25 deg off (the arm can't lean 25 deg
# away from its base, az 0). pipeline/pose_floor.py scans it in the simulator, and it is a plan
# the rig can run as it is. Written by
#   ros2 run so101_scan_sweep make_plan --target 0.26 0 -0.0024 --tilts 0 15 25 \
#       --azimuths 0 45 90 135 180 225 270 315 --name ring16
name: ring16
target_m: [0.26, 0.0, -0.0024]
move: {max_joint_speed_deg: 30.0, min_move_s: 1.0, settle_s: 0.5}
sweep: {start_angle_deg: -6.0, steps_per_line: 2, n_lines: 107, line_period_s: 0.0333}
viewpoints:
- name: down
  joints_deg: {shoulder_pan: -0.05, shoulder_lift: -8.98, elbow_flex: 60.81, wrist_flex: -51.83,
    wrist_roll: -87.21}
  slit_heading_deg: -90.0
- name: tilt15_az0
