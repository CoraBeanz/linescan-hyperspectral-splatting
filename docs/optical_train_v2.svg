<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif" font-size="12" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Optical train v2 (after Optiland model)</title>
<rect width="720" height="400" fill="#ffffff"/>
<text x="20" y="26" font-size="15" font-weight="bold" fill="#222">Line-scan spectrograph, top view, not to scale (v2)</text>
<text x="20" y="44" fill="#666">Changed from v1: field lens added at the slit; Pi NoIR stock lens replaced by M12 IMX219 NoIR + 12 mm f/2</text>
<!-- object -->
<rect x="50" y="320" width="90" height="28" rx="4" fill="#f1efe8" stroke="#5f5e5a"/><text x="95" y="338" text-anchor="middle" fill="#333">Object</text>
<text x="95" y="366" text-anchor="middle" fill="#666">150 mm path</text>
<path d="M95 320 L95 200 L560 200" fill="none" stroke="#888" stroke-width="1"/>
<!-- scan mirror -->
<line x1="78" y1="217" x2="112" y2="183" stroke="#444" stroke-width="3" stroke-linecap="round"/>
<text x="40" y="160" fill="#222">Scan mirror</text><text x="40" y="174" fill="#666">0.9° NEMA17</text>
<!-- LP filter -->
<rect x="150" y="176" width="5" height="48" fill="#f6c46b" stroke="#a86f00"/>
<text x="152" y="250" text-anchor="middle" fill="#222">Long-pass</text><text x="152" y="264" text-anchor="middle" fill="#666">≥500 nm</text>
<!-- objective -->
<ellipse cx="200" cy="200" rx="6" ry="26" fill="#d8e8f5" stroke="#3b6ea5"/>
<text x="200" y="160" text-anchor="middle" fill="#222">Objective</text><text x="200" y="174" text-anchor="middle" fill="#666">M12 16 mm, f/4 stop</text>
<!-- slit + field lens -->
<line x1="268" y1="170" x2="268" y2="196" stroke="#222" stroke-width="3"/><line x1="268" y1="204" x2="268" y2="230" stroke="#222" stroke-width="3"/>
<ellipse cx="278" cy="200" rx="4" ry="16" fill="#cdeccd" stroke="#2e8b57" stroke-width="1.5"/>
<text x="273" y="250" text-anchor="middle" fill="#222">Slit 50 µm × 5 mm</text>
<text x="273" y="264" text-anchor="middle" fill="#2e8b57" font-weight="bold">+ field lens f≈18 mm (new)</text>
<text x="235" y="215" text-anchor="middle" fill="#888" font-size="10">17.9 mm</text>
<!-- collimator -->
<ellipse cx="360" cy="200" rx="6" ry="24" fill="#d8e8f5" stroke="#3b6ea5"/>
<text x="360" y="160" text-anchor="middle" fill="#222">Collimator</text><text x="360" y="174" text-anchor="middle" fill="#666">M12 25 mm, reversed</text>
<text x="320" y="215" text-anchor="middle" fill="#888" font-size="10">25 mm</text>
<!-- grating -->
<rect x="440" y="174" width="4" height="52" fill="#e9d8f5" stroke="#7a4ea5"/>
<text x="442" y="250" text-anchor="middle" fill="#222">Grating 500 l/mm</text><text x="442" y="264" text-anchor="middle" fill="#666">3 mm before camera lens</text>
<text x="400" y="215" text-anchor="middle" fill="#888" font-size="10">22 mm</text>
<!-- dispersed rays -->
<line x1="444" y1="200" x2="512" y2="182" stroke="#2a7de1" stroke-width="1.5"/>
<line x1="444" y1="200" x2="512" y2="161" stroke="#c0392b" stroke-width="1.5"/>
<line x1="444" y1="200" x2="560" y2="200" stroke="#999" stroke-dasharray="3 3"/>
<text x="610" y="236" fill="#2a7de1" text-anchor="middle">500 nm at 14.5°</text><text x="610" y="252" fill="#c0392b" text-anchor="middle">1000 nm at 30°</text>
<text x="566" y="204" fill="#888">0th order</text>
<!-- camera tilted -->
<g transform="translate(498,170) rotate(-22)">
<rect x="-8" y="-22" width="16" height="44" fill="#cdeccd" stroke="#2e8b57" stroke-width="1.5"/>
<rect x="10" y="-26" width="34" height="52" rx="3" fill="#f1efe8" stroke="#5f5e5a"/>
</g>
<text x="455" y="104" fill="#222">Camera, tilted 22°</text>
<text x="455" y="118" fill="#2e8b57" font-weight="bold">M12 IMX219 NoIR + 12 mm f/2 (new)</text>
<!-- RGB pose camera -->
<rect x="300" y="300" width="120" height="28" rx="4" fill="#f1efe8" stroke="#5f5e5a"/><text x="360" y="318" text-anchor="middle" fill="#333">RGB pose camera</text>
<text x="360" y="346" text-anchor="middle" fill="#666">reads AprilTag board under object</text>
<text x="20" y="388" fill="#666">Model: 3.7 nm geometric resolution, 5.8 px/nm, ~33 px smile, ~11 px keystone, 98–100% light along the whole line.</text>
</svg>
