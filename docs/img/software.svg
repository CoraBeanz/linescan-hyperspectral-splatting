    text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .h1 { font-size: 32px; font-weight: 800; fill: #f1f5ff; }
    .sub { font-size: 17px; fill: #a3acc9; }
    .lt { font-size: 19px; font-weight: 700; fill: #e6e9f2; }
    .ls { font-size: 15px; fill: #8b93b0; font-family: ui-sans-serif, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .desc { font-size: 15.5px; fill: #c9d3f5; }
    .test { font-size: 14.5px; fill: #8fd9b6; }
    .small { font-size: 14px; fill: #8b93b0; font-style: italic; }
    .mono { font-size: 14.5px; font-weight: 700; fill: #e6e9f2; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .data { font-size: 14px; fill: #e6e9f2; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .band { font-size: 15px; fill: #a3acc9; }
  </style>
