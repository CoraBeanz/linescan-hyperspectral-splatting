[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hsisim"
version = "0.1.0"
description = "Digital twin of the line-scan hyperspectral spectrograph on the SO-101: scan sessions with known truth"
requires-python = ">=3.10"
# the floors of the calibration kit, whose code it runs (calibration/pyproject.toml)
dependencies = ["numpy>=2.0", "scipy>=1.15", "pyyaml>=6.0", "xacro>=2.1"]

[project.optional-dependencies]
preview = ["matplotlib>=3.9"]
fast = ["opencv-python-headless>=4.10.0.84"]
test = ["pytest>=7", "matplotlib>=3.9"]

# hsisim imports calibration/ and ros2/ from this repo, so install it editable (pip install -e .)
# or run it from this folder.
[tool.setuptools]
packages = ["hsisim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
